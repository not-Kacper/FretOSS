# wrangler.toml — Cloudflare Pages project + D1 binding.
#
# Deploy:  npm run build && npx wrangler pages deploy dist
# D1:      npx wrangler d1 create fretboard_progress   (then paste database_id below)
#          npx wrangler d1 execute fretboard_progress --remote --file=./migrations/0001_init.sql

name = "srs-fretboard"
compatibility_date = "2025-01-01"

[pages]
build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "fretboard_progress"
database_id = "FILL_IN_AFTER_RUNNING_wrangler_d1_create"
